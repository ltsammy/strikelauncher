<!--
  Example modlist.html - this is the format exported by the official Arma 3 Launcher
  (Mods tab -> preset -> "Export to file" -> HTML). Replace this file with your real
  exported preset and publish it at data/modlist.html so the launcher's ModlistUrl can
  fetch it via raw.githubusercontent.com.

  The parser only cares about <a> tags whose href contains
  "filedetails/?id=<workshopid>" - everything else (table layout, styling) is ignored,
  so an unmodified export from the official launcher will work as-is.
-->
<html>
<head><meta charset="utf-8" /></head>
<body>
<table>
<tbody>
<tr><td data-type="DisplayName"><a href="https://steamcommunity.com/sharedfiles/filedetails/?id=450814997" data-type="Link" data-name="CBA_A3">CBA_A3</a></td></tr>
<tr><td data-type="DisplayName"><a href="https://steamcommunity.com/sharedfiles/filedetails/?id=463939057" data-type="Link" data-name="ACE3">ACE3</a></td></tr>
<tr><td data-type="DisplayName"><a href="https://steamcommunity.com/sharedfiles/filedetails/?id=843577117" data-type="Link" data-name="Task Force Arrowhead Radio">Task Force Arrowhead Radio</a></td></tr>
<tr><td data-type="DisplayName"><a href="https://steamcommunity.com/sharedfiles/filedetails/?id=843425103" data-type="Link" data-name="RHSUSAF">RHSUSAF</a></td></tr>
</tbody>
</table>
</body>
</html>
