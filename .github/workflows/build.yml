name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.1-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore StrikeLauncher.sln

      - name: Build
        run: dotnet build StrikeLauncher.sln -c Release --no-restore

      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish src/StrikeLauncher/StrikeLauncher.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o ./publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Package with Velopack (auto-updater feed)
        run: >
          vpk pack --packId StrikeLauncher
          --packVersion ${{ steps.version.outputs.version }}
          --packDir ./publish
          --mainExe StrikeLauncher.exe
          --outputDir ./releases

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrikeLauncher-${{ steps.version.outputs.version }}
          path: ./releases/**

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./releases/**
          generate_release_notes: true
